name: Build & Test

# Verifies every push and pull request. `mvn verify` builds the whole reactor, so it
# compiles and tests the framework-neutral core, the Boot 3 starter (against Spring Boot 3),
# and the Boot 4 starter (against Spring Boot 4) in one run. Publishing is handled
# separately by publish.yml on release.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify
