# JitPack build config. https://jitpack.io/docs/BUILDING/
# Builds all modules (core + both Boot starters) and publishes each as a separate artifact
# under group com.github.Edward-Hanson.audit-sdk. Tests are skipped here (they run in CI);
# JitPack's shared builders only need to produce the jars.
jdk:
  - openjdk17
install:
  # Use the Maven Wrapper (pinned) — JitPack's system Maven is too old for
  # maven-compiler-plugin 3.13.0 (needs Maven >= 3.6.3).
  - ./mvnw install -DskipTests -B
